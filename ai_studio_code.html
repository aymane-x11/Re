<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروتوكول Angol AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; text-align: center; font-family: sans-serif; }
        h1 { margin: 10px 0; color: #00ff00; }
        #video-container { position: relative; display: inline-block; }
        video { width: 100%; max-width: 640px; border: 2px solid #333; border-radius: 10px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { color: yellow; font-weight: bold; }
    </style>
</head>
<body>
    <h1>بروتوكول ANGOL 👁️</h1>
    <p id="status">جاري تحميل الذكاء الاصطناعي...</p>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(video);
                    };
                });
            } catch (e) {
                statusText.innerText = "فشل الوصول للكاميرا. تأكد من إعطاء الصلاحيات!";
                statusText.style.color = "red";
            }
        }

        async function runAI() {
            await setupCamera();
            video.play();
            statusText.innerText = "جاري تحميل نموذج الرؤية...";
            
            const model = await cocoSsd.load();
            statusText.innerText = "البروتوكول يعمل: جاري التحليل!";
            statusText.style.color = "green";

            async function detectFrames() {
                const predictions = await model.detect(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                predictions.forEach(prediction => {
                    const isHighConfidence = prediction.score > 0.65;
                    ctx.strokeStyle = isHighConfidence ? "#00FF00" : "#FF0000";
                    ctx.lineWidth = 4;
                    ctx.fillStyle = isHighConfidence ? "#00FF00" : "#FF0000";
                    ctx.font = "24px Arial";

                    const [x, y, width, height] = prediction.bbox;
                    ctx.strokeRect(x, y, width, height);
                    
                    const text = `${prediction.class} (${Math.round(prediction.score * 100)}%)`;
                    ctx.fillText(text, x, y > 20 ? y - 10 : y + 20);
                });

                requestAnimationFrame(detectFrames); 
            }
            detectFrames();
        }

        runAI();
    </script>
</body>
</html>
